<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrimD Customer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;margin:0;background:#f4f6f9;color:#172033}
.wrap{max-width:700px;margin:auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}
input,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:9px}
button{padding:12px 16px;border:0;border-radius:9px;background:#f5a400;font-weight:bold;margin-top:8px}
.shop{border:1px solid #e5e8ed;border-radius:12px;padding:14px;margin:10px 0}
.muted{color:#737d8c;font-size:13px}
.ok{background:#e7f7ed;padding:12px;border-radius:9px}
.err{background:#ffe8e8;color:#a00000;padding:12px;border-radius:9px;margin-top:10px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
<h1>Trim<span style="color:#f5a400">D</span> Customer</h1>
<p class="muted">Nearby approved shops will appear here.</p>

<input id="name" placeholder="Your name">
<input id="mobile" placeholder="Mobile number" inputmode="tel">

<button onclick="getLocation()">📍 Find Nearby Shops</button>

<div id="shops"><div class="muted">Loading shops...</div></div>
</div>

<div class="card">
<h2>Booking</h2>

<select id="shop">
<option value="">Select shop</option>
</select>

<select id="service">
<option value="">Select service</option>
</select>

<select id="barber">
<option value="">Select barber</option>
</select>

<input id="time" placeholder="Appointment time e.g. 6:00 PM">

<button onclick="requestBooking()">Request Booking</button>
<div id="msg"></div>
</div>

<div class="card">
<h2>My Notifications</h2>
<div id="notifications" class="muted">Login/notification setup will appear here.</div>
</div>

</div>

<script>
const SUPABASE_URL = "https://bjebexsledooklafvfqb.supabase.co";
const SUPABASE_KEY = "sb_publishable_dgLMU1U1cG81VcG_8KeuPQ_juJ-O626";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let shops = [];
let lat = null;
let lon = null;

const shopSelect = document.getElementById("shop");
const serviceSelect = document.getElementById("service");
const barberSelect = document.getElementById("barber");
const shopsBox = document.getElementById("shops");

async function loadShops(){

  shopsBox.innerHTML = '<div class="muted">Loading approved shops...</div>';

  const { data, error } = await db
    .from("trimd_shops")
    .select("id,name,address,latitude,longitude,is_approved")
    .eq("is_approved", true);

  if(error){
    shopsBox.innerHTML =
      '<div class="err">Shop loading error:\\n' +
      error.message +
      '\\n\\nCode: ' + (error.code || '') +
      '</div>';

    shopSelect.innerHTML = '<option value="">Database error</option>';
    console.error("Supabase shop error:", error);
    return;
  }

  shops = data || [];

  if(shops.length === 0){
    shopsBox.innerHTML =
      '<div class="err">No approved shops found from the website database query.</div>';
    shopSelect.innerHTML = '<option value="">No shops found</option>';
    return;
  }

  shopsBox.innerHTML = shops.map(s => `
    <div class="shop">
      <b>${escapeHtml(s.name || "Unnamed shop")}</b>
      <div class="muted">${escapeHtml(s.address || "")}</div>
      <button onclick="chooseShop('${s.id}')">Book Here</button>
    </div>
  `).join("");

  shopSelect.innerHTML =
    '<option value="">Select shop</option>' +
    shops.map(s =>
      `<option value="${s.id}">${escapeHtml(s.name || "Unnamed shop")}</option>`
    ).join("");
}

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getLocation(){
  if(!navigator.geolocation){
    loadShops();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async p => {
      lat = p.coords.latitude;
      lon = p.coords.longitude;
      await loadShops();
    },
    async () => {
      await loadShops();
    }
  );
}

async function chooseShop(id){
  shopSelect.value = id;
  await loadRelated(id);
  document.querySelector(".card:nth-child(2)").scrollIntoView({behavior:"smooth"});
}

async function loadRelated(id){

  serviceSelect.innerHTML = '<option value="">Loading services...</option>';
  barberSelect.innerHTML = '<option value="">Loading barbers...</option>';

  const services = await db
    .from("trimd_services")
    .select("id,name,price")
    .eq("shop_id", id);

  if(services.error){
    serviceSelect.innerHTML = '<option value="">Service error</option>';
  }else{
    serviceSelect.innerHTML =
      '<option value="">Select service</option>' +
      (services.data || []).map(x =>
        `<option value="${x.id}">${escapeHtml(x.name)}${x.price ? " - ₹"+escapeHtml(x.price) : ""}</option>`
      ).join("");
  }

  const barbers = await db
    .from("trimd_barbers")
    .select("id,name")
    .eq("shop_id", id);

  if(barbers.error){
    barberSelect.innerHTML = '<option value="">Barber error</option>';
  }else{
    barberSelect.innerHTML =
      '<option value="">Select barber</option>' +
      (barbers.data || []).map(x =>
        `<option value="${x.id}">${escapeHtml(x.name)}</option>`
      ).join("");
  }
}

shopSelect.addEventListener("change", e => {
  if(e.target.value) loadRelated(e.target.value);
});

async function requestBooking(){

  const customerName = document.getElementById("name").value.trim();
  const customerMobile = document.getElementById("mobile").value.trim();
  const shop_id = shopSelect.value;
  const service_id = serviceSelect.value;
  const barber_id = barberSelect.value;
  const appointment_time = document.getElementById("time").value.trim();
  const msg = document.getElementById("msg");

  if(!customerName || !customerMobile || !shop_id || !service_id || !barber_id || !appointment_time){
    msg.innerHTML = '<div class="muted">Please fill all fields.</div>';
    return;
  }

  const { error } = await db.from("trimd_bookings").insert({
    shop_id,
    service_id,
    barber_id,
    customer_name: customerName,
    customer_mobile: customerMobile,
    appointment_time,
    status: "requested"
  });

  if(error){
    msg.innerHTML = '<div class="err">' + escapeHtml(error.message) + '</div>';
  }else{
    msg.innerHTML = '<div class="ok">Booking request sent. Waiting for shop confirmation.</div>';
  }
}

// Automatically load shops when page opens.
loadShops();
</script>
</body>
</html>
