<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrimD Customer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial;margin:0;background:#f4f6f9;color:#172033}
.wrap{max-width:700px;margin:auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}
input,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:9px}
button{padding:12px 16px;border:0;border-radius:9px;background:#f5a400;font-weight:bold;margin-top:8px}
button:disabled{opacity:.55}
.shop{border:1px solid #e5e8ed;border-radius:12px;padding:14px;margin:10px 0}
.muted{color:#737d8c;font-size:13px}
.ok{background:#e7f7ed;padding:12px;border-radius:9px}
.warn{background:#fff7ed;padding:12px;border-radius:9px;color:#9a3412}
.bad{background:#fee2e2;padding:12px;border-radius:9px;color:#991b1b}
.status{padding:14px;border-radius:12px;margin-top:10px;font-weight:bold}
.status.pending{background:#fff7ed;color:#9a3412}
.status.confirmed{background:#e7f7ed;color:#166534}
.status.rejected,.status.cancelled{background:#fee2e2;color:#991b1b}
.status.waiting{background:#e0f2fe;color:#075985}
.status.in_service{background:#ede9fe;color:#5b21b6}
.status.completed{background:#e7f7ed;color:#166534}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
<h1>Trim<span style="color:#f5a400">D</span> Customer</h1>
<p class="muted">Nearby approved shops will appear here.</p>
<input id="name" placeholder="Your name">
<input id="mobile" placeholder="Mobile number" inputmode="tel">
<button onclick="getLocation()">📍 Find Nearby Shops</button>
<div id="shops"></div>
</div>

<div class="card" id="currentCard">
<h2>My Booking</h2>
<div id="currentBooking" class="muted">No active booking yet.</div>
</div>

<div class="card">
<h2>Booking</h2>
<select id="shop"><option value="">Select shop</option></select>
<select id="service"><option value="">Select service</option></select>
<select id="barber"><option value="">Select barber</option></select>
<input id="time" placeholder="Appointment time e.g. 6:00 PM">
<button id="bookBtn" onclick="requestBooking()">Request Booking</button>
<div id="msg"></div>
</div>

<div class="card">
<h2>My Notifications</h2>
<div id="notifications" class="muted">Booking updates will appear here.</div>
</div>

</div>

<script>
const URL="https://bjebexsledooklafvfqb.supabase.co";
const KEY="sb_publishable_dgLMU1U1cG81VcG_8KeuPQ_juJ-O626";
const db=supabase.createClient(URL,KEY);

let shops=[],lat=null,lon=null;
let currentBookingId=localStorage.getItem("trimd_booking_id")||"";
let lastStatus="";

function esc(x){
  return String(x??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function getLocation(){
  if(!navigator.geolocation)return loadShops();
  navigator.geolocation.getCurrentPosition(
    async p=>{lat=p.coords.latitude;lon=p.coords.longitude;await loadShops()},
    async ()=>{await loadShops()}
  );
}

async function loadShops(){
  const e=document.getElementById("shops");

  // First try approved shops. If the existing shop record does not have
  // is_approved=true yet, fall back to all visible shops so the booking
  // dropdown does not become empty.
  let r=await db.from("trimd_shops")
    .select("*")
    .eq("is_approved",true);

  if(r.error){
    e.innerHTML='<div class="bad">'+esc(r.error.message)+'</div>';
    return;
  }

  shops=r.data||[];

  if(!shops.length){
    const fallback=await db.from("trimd_shops")
      .select("*")
      .order("name");
    if(fallback.error){
      e.innerHTML='<div class="bad">'+esc(fallback.error.message)+'</div>';
      return;
    }
    shops=fallback.data||[];
  }

  e.innerHTML=shops.map(s=>`
    <div class="shop">
      <b>${esc(s.name)}</b>
      <div class="muted">${esc(s.address||"")} ${s.city?" · "+esc(s.city):""}</div>
      <button onclick="choose('${esc(s.id)}')">Book Here</button>
    </div>
  `).join("")||'<div class="muted">No shops found. Please check the shop registration and Supabase RLS policy.</div>';

  document.getElementById("shop").innerHTML=
    '<option value="">Select shop</option>'+
    shops.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
}

async function choose(id){
  document.getElementById("shop").value=id;
  await loadRelated(id);
  document.getElementById("shop").scrollIntoView({behavior:"smooth",block:"center"});
}

async function loadRelated(id){
  const s=await db.from("trimd_services").select("*").eq("shop_id",id);
  document.getElementById("service").innerHTML=
    '<option value="">Select service</option>'+
    (s.data||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.price?' - ₹'+esc(x.price):''}</option>`).join("");

  const b=await db.from("trimd_barbers").select("*").eq("shop_id",id);
  document.getElementById("barber").innerHTML=
    '<option value="">Select barber</option>'+
    (b.data||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
}

document.getElementById("shop").onchange=e=>{
  if(e.target.value)loadRelated(e.target.value);
  else{
    document.getElementById("service").innerHTML='<option value="">Select service</option>';
    document.getElementById("barber").innerHTML='<option value="">Select barber</option>';
  }
};

async function requestBooking(){
  const customerName=document.getElementById("name").value.trim();
  const customerMobile=document.getElementById("mobile").value.trim();
  const shop_id=document.getElementById("shop").value;
  const service_id=document.getElementById("service").value;
  const barber_id=document.getElementById("barber").value;
  const appointment_time=document.getElementById("time").value.trim();
  const msg=document.getElementById("msg");
  const btn=document.getElementById("bookBtn");

  if(!customerName||!customerMobile||!shop_id||!service_id||!barber_id||!appointment_time){
    msg.innerHTML='<div class="warn">Please fill all fields.</div>';
    return;
  }

  // Don't create another active booking while one is still being processed.
  const active=await findActiveBooking(customerMobile);
  if(active){
    currentBookingId=active.id;
    localStorage.setItem("trimd_booking_id",active.id);
    renderBooking(active);
    msg.innerHTML='<div class="warn">You already have an active booking. Please wait for the shop update.</div>';
    return;
  }

  btn.disabled=true;
  msg.innerHTML='<div class="muted">Sending booking request...</div>';

  const r=await db.from("trimd_bookings").insert({
    shop_id,
    service_id,
    barber_id,
    customer_name:customerName,
    customer_mobile:customerMobile,
    appointment_time,
    status:"requested"
  }).select().single();

  btn.disabled=false;

  if(r.error){
    msg.innerHTML='<div class="bad">'+esc(r.error.message)+'</div>';
    return;
  }

  currentBookingId=r.data.id;
  localStorage.setItem("trimd_booking_id",r.data.id);
  lastStatus="";
  renderBooking(r.data);
  msg.innerHTML='<div class="ok">Booking request sent. Waiting for shop confirmation.</div>';

  // Keep the booking details visible instead of immediately looking like a fresh form.
  document.getElementById("time").value="";
  await refreshBooking();
}

// The shop dashboard uses "confirmed/rejected", while old records may use "requested".
function activeStatus(status){
  return ["requested","pending","confirmed","waiting","in_service"].includes(String(status||"").toLowerCase());
}

async function findActiveBooking(mobile){
  if(!mobile)return null;
  const r=await db.from("trimd_bookings")
    .select("*,trimd_shops(name),trimd_services(name,price),trimd_barbers(name)")
    .eq("customer_mobile",mobile)
    .in("status",["requested","pending","confirmed","waiting","in_service"])
    .order("created_at",{ascending:false})
    .limit(1);

  if(r.error || !r.data || !r.data.length)return null;
  return r.data[0];
}

async function refreshBooking(){
  let r=null;

  if(currentBookingId){
    const x=await db.from("trimd_bookings")
      .select("*,trimd_shops(name),trimd_services(name,price),trimd_barbers(name)")
      .eq("id",currentBookingId)
      .maybeSingle();
    if(!x.error)r=x.data;
  }

  if(!r){
    const mobile=document.getElementById("mobile").value.trim();
    if(mobile)r=await findActiveBooking(mobile);
  }

  if(r){
    currentBookingId=r.id;
    localStorage.setItem("trimd_booking_id",r.id);
    renderBooking(r);
  }
}

function renderBooking(b){
  const status=String(b.status||"requested").toLowerCase();
  const label={
    requested:"Waiting for shop",
    pending:"Waiting for shop",
    confirmed:"✓ Booking Confirmed",
    rejected:"✕ Booking Rejected",
    waiting:"You are in queue",
    in_service:"Service started",
    completed:"✓ Service completed",
    cancelled:"Booking cancelled"
  }[status]||status;

  const shopName=b.trimd_shops?.name||"";
  const service=b.trimd_services?.name||"";
  const barber=b.trimd_barbers?.name||"";

  document.getElementById("currentBooking").innerHTML=`
    <div class="status ${esc(status)}">${esc(label)}</div>
    <div style="margin-top:10px">
      <b>${esc(shopName)}</b><br>
      <span class="muted">
        ${esc(service)}
        ${b.trimd_services?.price!=null?" · ₹"+esc(b.trimd_services.price):""}
        ${barber?" · "+esc(barber):""}
        ${b.appointment_time?" · "+esc(b.appointment_time):""}
      </span>
    </div>
  `;

  if(status!==lastStatus){
    showNotification(label,b);
    lastStatus=status;
  }

  // Allow a new booking only after the previous booking is finished/rejected/cancelled.
  const locked=activeStatus(status);
  document.getElementById("bookBtn").disabled=locked;
}

function showNotification(title,b){
  const n=document.getElementById("notifications");
  const old=n.innerHTML==="Booking updates will appear here."?"":n.innerHTML;
  const text=b.status==="confirmed"
    ?"Your booking has been confirmed by the shop."
    :b.status==="rejected"
    ?"Your booking was rejected by the shop."
    :b.status==="waiting"
    ?"You have been added to the queue."
    :b.status==="in_service"
    ?"Your service has started."
    :b.status==="completed"
    ?"Your service has been completed."
    :"Your booking request is waiting for shop confirmation.";

  n.innerHTML=
    `<div class="ok"><b>${esc(title)}</b><br>${esc(text)}<br><span class="muted">${new Date().toLocaleString()}</span></div>`+
    old;
}

async function autoRefresh(){
  // If mobile is entered, pick up an active booking even after page refresh.
  const mobile=document.getElementById("mobile").value.trim();
  if(!currentBookingId && mobile){
    const active=await findActiveBooking(mobile);
    if(active){
      currentBookingId=active.id;
      localStorage.setItem("trimd_booking_id",active.id);
    }
  }
  await refreshBooking();
}

document.getElementById("mobile").addEventListener("blur",autoRefresh);

// Refresh status every 5 seconds so the customer sees Confirm/Reject/Queue updates.
setInterval(autoRefresh,5000);

// Load approved shops and existing booking when the page opens.
loadShops();
autoRefresh();
</script>
</body>
</html>
