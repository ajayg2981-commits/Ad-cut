<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrimD Shop Owner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;margin:0;background:#f4f6f9;color:#172033}.wrap{max-width:700px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:16px;margin:12px 0;box-shadow:0 2px 12px #0001}
input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:9px}button{padding:11px 15px;border:0;border-radius:9px;background:#f5a400;font-weight:bold;margin:5px 4px 5px 0}.row{border-bottom:1px solid #eee;padding:14px 0}.muted{color:#737d8c;font-size:13px}
</style></head><body><div class="wrap">
<div class="card"><h1>TrimD Shop Owner</h1><p class="muted">Register your shop manually.</p>
<input id="owner" placeholder="Owner name"><input id="shopname" placeholder="Shop name"><input id="address" placeholder="Shop address"><input id="mobile" placeholder="Mobile"><input id="wa" placeholder="WhatsApp number with country code">
<button onclick="registerShop()">Register Shop</button><div id="reg"></div></div>
<div class="card"><h2>Booking Requests</h2><p class="muted">After your shop is registered, requests will appear here.</p><div id="bookings"></div></div>
</div>
<script>
const URL="https://bjebexsledooklafvfqb.supabase.co",KEY="sb_publishable_dgLMU1U1cG81VcG_8KeuPQ_juJ-O626";const db=supabase.createClient(URL,KEY);let shopId=null;
async function registerShop(){if(!shopname.value||!mobile.value){reg.textContent='Shop name and mobile are required.';return}let r=await db.from('trimd_shops').insert({name:shopname.value,address:address.value,mobile:mobile.value,whatsapp:wa.value,latitude:null,longitude:null,is_approved:false}).select().single();reg.textContent=r.error?r.error.message:'Shop registered. Admin approval is required before customers can see it.';if(r.data){shopId=r.data.id;loadBookings()}}
async function loadBookings(){if(!shopId)return;let r=await db.from('trimd_bookings').select('*').eq('shop_id',shopId).order('created_at',{ascending:false});bookings.innerHTML=(r.data||[]).map(b=>`<div class="row"><b>${b.customer_name}</b><div class="muted">${b.customer_mobile} · ${b.appointment_time||''} · ${b.status}</div><button onclick="setStatus('${b.id}','confirmed')">✅ Confirm</button><button onclick="setStatus('${b.id}','rejected')">❌ Reject</button></div>`).join('')||'<div class="muted">No requests yet.</div>'}
async function setStatus(id,status){await db.from('trimd_bookings').update({status,confirmed_at:status==='confirmed'?new Date().toISOString():null}).eq('id',id);loadBookings()}
</script></body></html>
