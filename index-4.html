<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrimD — Barber Appointment & Queue</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="description" content="TrimD is a smart barber appointment and queue management app.">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#111827,#1f2937);
  color:#fff;
  min-height:100vh;
}
main{
  max-width:520px;
  margin:auto;
  padding:28px 18px 40px;
}
.card{
  background:#fff;
  color:#172033;
  padding:28px 22px;
  border-radius:24px;
  margin-top:35px;
  box-shadow:0 12px 40px #0005;
  text-align:center;
}
.logo{
  width:88px;
  height:88px;
  margin:0 auto 16px;
  border-radius:22px;
  object-fit:cover;
  box-shadow:0 6px 18px #0002;
}
h1{
  margin:0;
  font-size:38px;
  letter-spacing:-1px;
}
.brand-d{color:#f5a400}
.tagline{
  color:#667085;
  margin:8px 0 24px;
  line-height:1.5;
}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:13px;
  font-size:16px;
  font-weight:bold;
  margin-top:12px;
  cursor:pointer;
}
.customer{
  background:#f5a400;
  color:#111827;
}
.shop{
  background:#111827;
  color:#fff;
}
button:active{transform:scale(.98)}
.footer{
  text-align:center;
  color:#cbd5e1;
  font-size:12px;
  margin-top:22px;
}
</style>
</head>

<body>
<main>
  <div class="card">

    <!-- TrimD app logo -->
    <img
      class="logo"
      src="launchericon-192x192.png"
      alt="TrimD Logo"
      onerror="this.style.display='none'"
    >

    <h1>Trim<span class="brand-d">D</span></h1>

    <p class="tagline">
      Smart barber appointments &amp; live queue management.
    </p>

    <button class="customer" onclick="location.href='customer.html'">
      👤 Customer App
    </button>

    <button class="shop" onclick="location.href='shop.html'">
      🏪 Shop Owner App
    </button>

  </div>

  <div class="footer">
    © 2026 TrimD • Book smarter. Wait less.
  </div>
</main>
</body>
</html>
