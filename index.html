<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TrimD</title>
<meta name="theme-color" content="#f5a400">
<meta name="description" content="TrimD - Smart barber appointments and live queue management.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="launchericon-192x192.png">
<link rel="apple-touch-icon" href="launchericon-192x192.png">
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;min-height:100vh;background:#111827;color:#172033}
main{max-width:520px;margin:auto;padding:42px 18px}
.card{background:#fff;padding:26px 20px;border-radius:22px;margin:16px 0;box-shadow:0 10px 35px #0004;text-align:center}
.logo{width:96px;height:96px;object-fit:contain;border-radius:22px;margin:0 auto 14px;display:block}
h1{font-size:34px;margin:0 0 8px}
.brandD{color:#f5a400}
p{color:#7b8494;margin:0 0 22px}
button{width:100%;padding:15px;border:0;border-radius:12px;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer}
.customer{background:#f5a400;color:#111827}
.shop{background:#111827;color:#fff}
footer{text-align:center;color:#9ca3af;font-size:12px;margin-top:18px}
</style>
</head>
<body>
<main>
<div class="card">
<img class="logo" src="launchericon-192x192.png" alt="TrimD logo">
<h1>Trim<span class="brandD">D</span></h1>
<p>Smart barber appointments &amp; live queue management.</p>
<button class="customer" onclick="location.href='customer.html'">👤 Customer App</button>
<button class="shop" onclick="location.href='shop.html'">🏪 Shop Owner App</button>
</div>
<footer>© 2026 TrimD · Book smarter. Wait less.</footer>
</main>
</body>
</html>
