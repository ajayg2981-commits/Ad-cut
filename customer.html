<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrimD Customer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
.top{background:#111827;color:#fff;padding:16px;position:sticky;top:0;z-index:5}
.topin,.wrap{max-width:700px;margin:auto}
.brand{font-size:24px;font-weight:900}.brand b{color:#f59e0b}
.wrap{padding:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:16px}
input,select{width:100%;padding:13px;border:1px solid #d9dee8;border-radius:9px;margin:5px 0 10px;background:#fff}
.btn{border:0;background:#f59e0b;color:#111827;font-weight:800;border-radius:9px;padding:12px 16px;cursor:pointer}
.btn.alt{background:#e8edf5}.btn.red{background:#fee2e2;color:#991b1b}
.notice{padding:12px;border-radius:10px;background:#ecfdf5;color:#166534;margin-top:10px}
.error{background:#fee2e2;color:#991b1b}
.muted{color:#64748b;font-size:13px}
.row{border-bottom:1px solid #eee;padding:13px 0}
.hidden{display:none}
.shop{border:1px solid #e5e7eb;border-radius:12px;padding:13px;margin:10px 0}
.shop h3{margin:0 0 5px}
.small{font-size:12px;color:#64748b}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">Trim<b>D</b> Customer</div></div></div>

<div class="wrap">
<section class="card">
<p class="muted">Find shops available near you and request a booking.</p>
<input id="customerName" placeholder="Your name">
<input id="customerMobile" inputmode="numeric" placeholder="Mobile number">
<button class="btn" onclick="findShops()">📍 Find Nearby Shops</button>
<div id="findMsg"></div>
<div id="shopList"></div>
</section>

<section class="card">
<h2>My Booking</h2>
<div id="myBooking"><p class="muted">No active booking yet.</p></div>
</section>

<section class="card">
<h2>Booking</h2>
<select id="shopSelect" onchange="shopChanged()">
<option value="">Select shop</option>
</select>
<select id="serviceSelect" onchange="serviceChanged()">
<option value="">Select service</option>
</select>
<select id="barberSelect">
<option value="">Select barber</option>
</select>
<input id="appointmentTime" placeholder="Appointment time e.g. 6:00 PM">
<button class="btn" onclick="requestBooking()">Request Booking</button>
<div id="bookingMsg"></div>
</section>

<section class="card">
<h2>My Notifications</h2>
<div id="notifications"><p class="muted">Login/notification setup will appear here.</p></div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://bjebexsledooklafvfqb.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_dgLMU1U1cG81VcG_8KeuPQ_juJ-O626";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

let shops=[];
let services=[];
let barbers=[];
let selectedShop=null;
let currentBooking=null;

function v(id){return document.getElementById(id).value.trim()}
function vset(id,x){document.getElementById(id).value=x||""}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function msg(id,t,err=false){
 const e=document.getElementById(id);
 e.className=err?"notice error":"notice";
 e.textContent=t;
}

/*
 IMPORTANT:
 We deliberately do NOT filter trimd_shops by an "approved" column.
 Your Supabase SQL result already proves that trimd_shops contains the shop "Dk".
 This avoids the customer page hiding the shop because of a missing/wrong
 approval field.
*/
async function loadShops(){
 const {data,error}=await db.from("trimd_shops")
   .select("id,name,description,address,city,latitude,longitude")
   .order("name");

 if(error){
   console.error(error);
   msg("findMsg","Shop loading error: "+error.message,true);
   return;
 }

 shops=data||[];
 renderShopSelect();
 renderShopList();
}

function renderShopSelect(){
 const s=document.getElementById("shopSelect");
 s.innerHTML='<option value="">Select shop</option>'+
   shops.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.city?" — "+esc(x.city):""}</option>`).join("");
}

function renderShopList(){
 const box=document.getElementById("shopList");
 if(!shops.length){
   box.innerHTML='<p class="muted">No shops found.</p>';
   return;
 }
 box.innerHTML=shops.map(x=>`
   <div class="shop">
     <h3>${esc(x.name)}</h3>
     <div class="small">${esc(x.city||"")}${x.address?" · "+esc(x.address):""}</div>
     ${x.description?`<p class="muted">${esc(x.description)}</p>`:""}
     <button class="btn" onclick="chooseShop('${esc(x.id)}')">Book here</button>
   </div>
 `).join("");
}

async function findShops(){
 msg("findMsg","Loading shops...");
 await loadShops();
 if(shops.length) msg("findMsg",shops.length+" shop(s) found.");
}

function chooseShop(id){
 vset("shopSelect",id);
 shopChanged();
 document.getElementById("shopSelect").scrollIntoView({behavior:"smooth",block:"center"});
}

async function shopChanged(){
 const id=v("shopSelect");
 selectedShop=shops.find(x=>x.id===id)||null;
 document.getElementById("serviceSelect").innerHTML='<option value="">Select service</option>';
 document.getElementById("barberSelect").innerHTML='<option value="">Select barber</option>';
 services=[];barbers=[];
 if(!selectedShop)return;

 const [sr,br]=await Promise.all([
   db.from("trimd_services").select("*").eq("shop_id",id).order("name"),
   db.from("trimd_barbers").select("*").eq("shop_id",id).order("name")
 ]);

 if(sr.error){msg("bookingMsg",sr.error.message,true);return}
 if(br.error){msg("bookingMsg",br.error.message,true);return}

 services=sr.data||[];
 barbers=br.data||[];

 document.getElementById("serviceSelect").innerHTML=
   '<option value="">Select service</option>'+
   services.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ₹${x.price} (${x.duration_minutes||30} min)</option>`).join("");

 document.getElementById("barberSelect").innerHTML=
   '<option value="">Select barber</option>'+
   barbers.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");

 msg("bookingMsg",selectedShop.name+" selected.");
}

function serviceChanged(){}

async function requestBooking(){
 const name=v("customerName");
 const mobile=v("customerMobile");
 const shopId=v("shopSelect");
 const serviceId=v("serviceSelect");
 const barberId=v("barberSelect");
 const appointment=v("appointmentTime");

 if(!name||!mobile||!shopId||!serviceId||!barberId||!appointment){
   return msg("bookingMsg","Please fill name, mobile, shop, service, barber and appointment time.",true);
 }

 const today=new Date().toISOString().slice(0,10);
 const {data,error}=await db.from("trimd_bookings").insert({
   shop_id:shopId,
   service_id:serviceId,
   barber_id:barberId,
   customer_name:name,
   customer_mobile:mobile.replace(/\D/g,""),
   booking_date:today,
   appointment_time:appointment,
   status:"requested"
 }).select().single();

 if(error){
   console.error(error);
   return msg("bookingMsg",error.message,true);
 }

 currentBooking=data;
 showBooking(data);
 msg("bookingMsg","Booking request sent. Waiting for shop confirmation.");
 await loadNotifications();
}

function showBooking(b){
 const status=b.status||"requested";
 document.getElementById("myBooking").innerHTML=`
   <div class="row">
     <b>Status: ${esc(status)}</b><br>
     <span class="muted">Booking ID: ${esc(b.id)}</span><br>
     <span class="muted">${esc(b.booking_date)} · ${esc(b.appointment_time)}</span>
   </div>`;
}

async function loadNotifications(){
 document.getElementById("notifications").innerHTML=
   '<p class="muted">Booking status updates will appear here.</p>';
}

function subscribeToBooking(id){
 if(!id)return;
 db.channel("customer-booking-"+id)
 .on("postgres_changes",
   {event:"UPDATE",schema:"public",table:"trimd_bookings",filter:"id=eq."+id},
   payload=>{
     currentBooking=payload.new;
     showBooking(payload.new);
     msg("bookingMsg","Booking status updated: "+payload.new.status);
   })
 .subscribe();
}

async function restoreBooking(){
 // Keep the last booking on this browser so customer can see confirmation.
 const saved=localStorage.getItem("trimd_last_booking");
 if(!saved)return;
 try{
   const x=JSON.parse(saved);
   if(!x.id)return;
   const {data,error}=await db.from("trimd_bookings").select("*").eq("id",x.id).maybeSingle();
   if(!error && data){
     currentBooking=data;
     showBooking(data);
     subscribeToBooking(data.id);
   }
 }catch(e){}
}

const oldRequestBooking=requestBooking;
requestBooking=async function(){
 await oldRequestBooking();
 if(currentBooking){
   localStorage.setItem("trimd_last_booking",JSON.stringify({id:currentBooking.id}));
   subscribeToBooking(currentBooking.id);
 }
};

window.addEventListener("load",async()=>{
 await loadShops();
 await restoreBooking();
});
</script>
</body>
</html>
